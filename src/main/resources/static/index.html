<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#dde1e7;--me:#1f5eff;--bot:#eef1f5;--err:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2029;--ink:#e8ecf1;--mute:#93a0b0;--line:#2b3441;--bot:#232c38}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:640px;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;height:calc(100vh - 32px)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:1.05rem;margin:0}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{background:var(--me);color:#fff;border-color:var(--me);cursor:pointer}
button.ghost{background:none;color:var(--mute);border-color:var(--line)}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--me);outline-offset:2px}
#auth{padding:24px 16px;display:flex;flex-direction:column;gap:10px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:8px 12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bot)}
.m.user{align-self:flex-end;background:var(--me);color:#fff}
.m.err{color:var(--err);background:none;border:1px solid var(--err)}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
form input{flex:1}
#msg{color:var(--err);min-height:1.4em;margin:0}
.hide{display:none!important}
</style></head><body>
<main>
  <header><h1>Chatbot</h1><button id="out" class="ghost hide">Log out</button></header>

  <section id="auth">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
    <div style="display:flex;gap:8px"><button id="login">Log in</button><button id="reg" class="ghost">Create account</button></div>
    <p id="msg" role="alert"></p>
  </section>

  <section id="chat" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div id="log" aria-live="polite"></div>
    <form id="f"><input id="q" placeholder="Ask something" maxlength="2000" required autocomplete="off"><button id="send">Send</button></form>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem('token');

async function api(path, method, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(token && { Authorization: 'Bearer ' + token }) }, body: body && JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401 && token) logout(); throw new Error(data.error?.message || 'Request failed'); }
  return data;
}
function add(role, text) { const d = document.createElement('div'); d.className = 'm ' + role; d.textContent = text; $('log').append(d); $('log').scrollTop = 1e9; return d; }
function show(loggedIn) { $('auth').classList.toggle('hide', loggedIn); $('chat').classList.toggle('hide', !loggedIn); $('out').classList.toggle('hide', !loggedIn); }
function logout() { token = null; localStorage.removeItem('token'); $('log').innerHTML = ''; show(false); }

async function enter(path) {
  $('msg').textContent = '';
  try {
    const r = await api(path, 'POST', { email: $('email').value, password: $('pw').value });
    token = r.token; localStorage.setItem('token', token); $('pw').value = '';
    await open();
  } catch (e) { $('msg').textContent = e.message; }
}
async function open() {
  show(true); $('log').innerHTML = '';
  try { (await api('/api/chat/history', 'GET')).forEach(m => add(m.role, m.content)); } catch (e) { $('msg').textContent = e.message; }
}
$('login').onclick = () => enter('/api/auth/login');
$('reg').onclick = () => enter('/api/auth/register');
$('out').onclick = logout;
$('f').onsubmit = async e => {
  e.preventDefault();
  const text = $('q').value.trim(); if (!text) return;
  $('q').value = ''; $('send').disabled = true; add('user', text);
  const wait = add('bot', '…');
  try { wait.textContent = (await api('/api/chat', 'POST', { message: text })).reply; }
  catch (err) { wait.className = 'm err'; wait.textContent = err.message; }
  $('send').disabled = false; $('q').focus();
};
if (token) open();
</script></body></html>
