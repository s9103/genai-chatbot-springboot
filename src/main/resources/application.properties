spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chatbot}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (secret must be 32+ chars)
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-32chars-min}
jwt.ttl-minutes=60

# LLM: any OpenAI-compatible API. Blank key = mock replies (app still runs)
llm.base-url=https://generativelanguage.googleapis.com
llm.api-key=${GEMINI_API_KEY:}
llm.model=gemini-3.8-flash
llm.max-tokens=300
llm.history-limit=10
